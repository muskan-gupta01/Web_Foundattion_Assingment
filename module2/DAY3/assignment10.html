<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <link rel="stylesheet" href="assignment10.css">
</head>

<body>

    <header class="header">
        <h1>My Photo Gallery</h1>
        <p>A collection of beautiful moments</p>
    </header>

    <main class="gallery-container">

        <div class="gallery">
            <div class="photo">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80"
                    alt="Beautiful mountain landscape">
                <h3>Mountain View</h3>
            </div>

            <div class="photo">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80"
                    alt="Lake surrounded by mountains">
                <h3>Peaceful Lake</h3>
            </div>

            <div class="photo">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=700&q=80"
                    alt="Nature and green mountains">
                <h3>Green Nature</h3>
            </div>

            <div class="photo">
                <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=700&q=80"
                    alt="Ocean waves">
                <h3>Ocean Waves</h3>
            </div>

            <div class="photo">
                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=700&q=80"
                    alt="Sunrise over a landscape">
                <h3>Golden Sunrise</h3>
            </div>

            <div class="photo">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80"
                    alt="Sunlight in a forest">
                <h3>Forest Beauty</h3>
            </div>

            <div class="photo">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80"
                    alt="Snow-covered mountain peaks">
                <h3>Snowy Peaks</h3>
            </div>

            <div class="photo">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=700&q=80"
                    alt="Sunny beach">
                <h3>Sunny Beach</h3>
            </div>

            <div class="photo">
                <img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=700&q=80"
                    alt="Green trees in nature">
                <h3>Nature Walk</h3>
            </div>
        </div>

    </main>

    <footer>
        <p>Made with ❤️ by Muskan Gupta</p>
    </footer>

</body>

</html>
