<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>
    <link rel="stylesheet" href="product.css">
</head>
<body>

    <header>
        <h1>My Store</h1>
        <p>Find your favourite products</p>
    </header>

    <section class="products">

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Headphones">
            <h2>Headphones</h2>
            <p>Enjoy clear and quality sound.</p>
            <h3>₹999</h3>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Smart Watch">
            <h2>Smart Watch</h2>
            <p>A stylish watch for everyday use.</p>
            <h3>₹1,499</h3>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Sports Shoes">
            <h2>Sports Shoes</h2>
            <p>Comfortable shoes for daily wear.</p>
            <h3>₹1,299</h3>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500" alt="Travel Bag">
            <h2>Travel Bag</h2>
            <p>A useful bag for your journeys.</p>
            <h3>₹799</h3>
            <button>Add to Cart</button>
        </div>

    </section>

</body>
</html>
