<!DOCTYPE html>
<html>
<head>
    <title>Professional Job Application Form</title>
</head>
<body>

    <h1>Job Application Form</h1>
    <p>Please fill in the details below to apply for a job.</p>

    <form>

        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <br><br>

            <label for="address">Address:</label>
            <br>
            <textarea id="address" name="address" rows="3" cols="35"></textarea>
        </fieldset>

        <br>

        <fieldset>
            <legend>Job Details</legend>

            <label for="position">Position Applied For:</label>
            <select id="position" name="position" required>
                <option value="">--Select Position--</option>
                <option value="AI/ML Intern">AI/ML Intern</option>
                <option value="Web Developer">Web Developer</option>
                <option value="Data Analyst">Data Analyst</option>
                <option value="Software Developer">Software Developer</option>
            </select>
            <br><br>

            <label for="experience">Work Experience:</label>
            <select id="experience" name="experience">
                <option value="">--Select Experience--</option>
                <option value="Fresher">Fresher</option>
                <option value="0-1 Years">0–1 Years</option>
                <option value="1-3 Years">1–3 Years</option>
                <option value="3+ Years">3+ Years</option>
            </select>
            <br><br>

            <label for="joiningdate">Available Joining Date:</label>
            <input type="date" id="joiningdate" name="joiningdate">
            <br><br>

            <label for="salary">Expected Salary:</label>
            <input type="number" id="salary" name="salary" min="0">
        </fieldset>

        <br>

        <fieldset>
            <legend>Educational Qualifications</legend>

            <label for="qualification">Highest Qualification:</label>
            <select id="qualification" name="qualification" required>
                <option value="">--Select Qualification--</option>
                <option value="12th">Class XII</option>
                <option value="Diploma">Diploma</option>
                <option value="Graduation">Graduation</option>
                <option value="Post-Graduation">Post-Graduation</option>
            </select>
            <br><br>

            <label for="college">College/University Name:</label>
            <input type="text" id="college" name="college">
            <br><br>

            <label for="skills">Technical Skills:</label>
            <br>
            <textarea id="skills" name="skills" rows="3" cols="35"
                placeholder="Enter your technical skills"></textarea>
        </fieldset>

        <br>

        <fieldset>
            <legend>Resume and Declaration</legend>

            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
            <br><br>

            <input type="checkbox" id="declaration" name="declaration" required>
            <label for="declaration">
                I declare that the information provided is correct.
            </label>
        </fieldset>

        <br>

        <button type="submit">Submit Application</button>
        <button type="reset">Reset Form</button>

    </form>

</body>
</html>
